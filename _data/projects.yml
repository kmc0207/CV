# Projects / Publications
# First-author entries first, then co-author.

# ===== First-Author =====
- project: "Stable-GFlowNet: Toward Diverse and Robust LLM Red-Teaming via Contrastive Trajectory Balance"
  authors: "Minchan Kwon, Sunghyun Baek, Minseo Kim, Dongyoon Han*, Junmo Kim* (First Author)"
  conference: "ICML 2026 Spotlight (Top 2.2%) &bull; Sep. 2025"
  paper_url: "https://arxiv.org/abs/2605.00553"
  description: "We address the critical instability issues that arise when training LLMs with GFlowNet via a new loss function called Contrastive Trajectory Balance. The approach ensures stable LLM training while preserving GFN's diversity, discovering 7x more adversarial prompts than the original GFN."

- project: "Preference Distillation via Value based Reinforcement Learning"
  authors: "Minchan Kwon, Junwon Ko, Kangil Kim*, Junmo Kim* (First Author)"
  conference: "NeurIPS 2025 &bull; Sep. 2025"
  paper_url: "https://arxiv.org/abs/2509.16965"
  code_url: "https://github.com/kmc0207/Preference-Distillation-via-Value-based-Reinforcement-Learning"
  description: "Examining the distillation task on a DPO-style dataset from an RL perspective, we observed a multi-reward phenomenon. We propose a method that resolves this multi-reward issue and provide a mathematical proof for it."

- project: "StablePrompt: Automatic Prompt Tuning using Reinforcement Learning for Large Language Model"
  authors: "Minchan Kwon, Gaeun Kim, Jongsuk Kim, Haeil Lee, Junmo Kim (First Author)"
  conference: "EMNLP 2024 &bull; Sep. 2024"
  paper_url: "https://arxiv.org/abs/2410.07652"
  code_url: "https://github.com/kmc0207/Stableprompt"
  description: "Creating suitable prompts manually for each task is painful. We provide a method for generating prompts fully automatically using Online-RL, requiring only the task description, training dataset, the LLM to use the prompts, and the LLM to create them."

