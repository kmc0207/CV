# Publications, grouped by authorship.
# conference: full line shown by the resume layout
# venue / award / date: used separately by the Barron-style layout

first_author:
  - project: "Do LLMs Learn from Rewards in Context? Rethinking the Role of Reward in In-Context RL"
    authors: "Minchan Kwon, Seunghee Koh, Sunghyun Baek, Minsung Bae, Junmo Kim"
    conference: "NeurIPS 2026 Spotlight (Top 1.3%) &ndash; Negative Results Track"
    venue: "NeurIPS 2026"
    award: "Spotlight (Top 1.3%) &middot; Negative Results Track"
    paper_url: "https://arxiv.org/abs/2610.11152"
    description: "We investigate whether LLMs genuinely learn from reward-trajectory examples provided in context. Our findings suggest that in-context RL behaves more like conventional in-context learning, with limited sensitivity to rewards, raising questions about how agents learn from past experiences."

  - project: "Stable-GFlowNet: Toward Diverse and Robust LLM Red-Teaming via Contrastive Trajectory Balance"
    authors: "Minchan Kwon, Sunghyun Baek, Minseo Kim, Dongyoon Han*, Junmo Kim*"
    conference: "ICML 2026 Spotlight (Top 2.2%)"
    venue: "ICML 2026"
    award: "Spotlight (Top 2.2%)"
    paper_url: "https://arxiv.org/abs/2605.00553"
    description: "We introduce Contrastive Trajectory Balance to address training instability in GFlowNet-based LLM optimization while preserving diverse successful trajectories. Applied to LLM red-teaming, our method discovers 7&times; more unique successful adversarial prompts."

  - project: "Preference Distillation via Value based Reinforcement Learning"
    authors: "Minchan Kwon, Junwon Ko, Kangil Kim*, Junmo Kim*"
    conference: "NeurIPS 2025"
    venue: "NeurIPS 2025"
    paper_url: "https://arxiv.org/abs/2509.16965"
    code_url: "https://github.com/kmc0207/Preference-Distillation-via-Value-based-Reinforcement-Learning"
    description: "Examining distillation with DPO-style datasets from an RL perspective, we identify a multi-reward issue in preference distillation and propose a value-based RL approach to address it, supported by theoretical analysis."

  - project: "StablePrompt: Automatic Prompt Tuning using Reinforcement Learning for Large Language Model"
    authors: "Minchan Kwon, Gaeun Kim, Jongsuk Kim, Haeil Lee, Junmo Kim"
    conference: "EMNLP 2024"
    venue: "EMNLP 2024"
    paper_url: "https://arxiv.org/abs/2410.07652"
    code_url: "https://github.com/kmc0207/Stableprompt"
    description: "Creating suitable prompts manually for each task is painful. We generate prompts fully automatically with online RL, requiring only the task description, a training dataset, the LLM that uses the prompts, and the LLM that writes them."

