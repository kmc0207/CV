resume_header_intro: "<p>I am a PhD student at KAIST working on reinforcement learning and LLM post-training. My research focuses on understanding and improving how language models learn from rewards and trajectories, with an emphasis on training stability, diversity, and reasoning. I am particularly interested in developing learning algorithms that help language models acquire new capabilities through interaction and feedback.</p>"

